[project]
name = "docguard"
version = "0.1.0"
description = "AI-powered documentation reliability and drift detection for software engineering teams."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DocGuard Team"}
]
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "markdown-it-py>=3,<4",
    "linkify-it-py>=2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.scripts]
docguard = "docguard.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008"]

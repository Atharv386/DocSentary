name: DocGuard PR Analysis
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DocGuard
        run: pip install -e .

      - name: Run scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCGUARD_MODEL_API_KEY: ${{ secrets.DOCGUARD_MODEL_API_KEY }}
        run: |
          if [ -z "$DOCGUARD_MODEL_API_KEY" ]; then
            echo "Model credential unavailable; running deterministic scan."
            docguard scan --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
              --no-model --output-dir artifacts/docguard
          else
            docguard scan --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
              --output-dir artifacts/docguard
          fi

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f artifacts/docguard/report.md ]; then
            cat artifacts/docguard/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docguard-report
          path: artifacts/docguard/
          if-no-files-found: ignore
